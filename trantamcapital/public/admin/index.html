<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager - TrantamCapital</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="cms-root"></div>
  <script>
    // Hàm này được popup auth gọi trực tiếp (cùng origin)
    window.__authComplete = function(token) {
      // Lưu token để dùng sau khi reload
      sessionStorage.setItem('dcms_token', token);

      // Nếu CMS backend đã sẵn sàng, set token trực tiếp
      if (window.CMS && window.CMS.getBackend) {
        window.CMS.getBackend().then(function(backend) {
          if (backend && backend.authenticate) {
            backend.authenticate({ token: token }).then(function() {
              // Reload để CMS render dashboard
              window.location.reload();
            });
          }
        });
      }
    };
  </script>
  <script>
    // Nếu có token từ sessionStorage, dùng nó trước
    var savedToken = sessionStorage.getItem('dcms_token');
    if (savedToken) {
      sessionStorage.removeItem('dcms_token');
      window.__authComplete(savedToken);
    }
  </script>
  <script>
    window.CMS_MANUAL_INIT = true;
    window.CMS_CONFIG = {
      backend: {
        name: "github",
        repo: "arizonainlove/trantamcapital",
        branch: "main",
        base_url: "https://trantamcapital.vercel.app",
        auth_endpoint: "api/auth",
      },
      media_folder: "public/images/uploads",
      public_folder: "/images/uploads",
      collections: [
        {
          name: "news",
          label: "News Articles",
          folder: "src/content/news",
          create: true,
          slug: "{{slug}}",
          fields: [
            { label: "Title", name: "title", widget: "string" },
            { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
            { label: "Category", name: "category", widget: "select", options: ["Cryptocurrency", "Forex", "Binary Options", "Markets"] },
            { label: "Author", name: "author", widget: "string", default: "TrantamCapital" },
            { label: "Image", name: "image", widget: "image", required: false },
            { label: "Excerpt", name: "excerpt", widget: "text", pattern: ["^.{10,}$", "Must be at least 10 characters"] },
            { label: "Body", name: "body", widget: "markdown" },
          ],
        },
      ],
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3/dist/decap-cms.js"></script>
  <script>
    CMS.init({ config: window.CMS_CONFIG });
  </script>
</body>
</html>
