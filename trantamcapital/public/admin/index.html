<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager - TrantamCapital</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="cms-root"></div>
  <script>
    // Redirect to trailing slash so config.yml resolves correctly
    if (!window.location.pathname.endsWith('/')) {
      window.location.href = window.location.pathname + '/' + window.location.hash;
    }
  </script>
  <script>
    window.__authComplete = function(token) {
      localStorage.setItem('dcms_token', token);
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3/dist/decap-cms.js"></script>
</body>
</html>
