<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager - TrantamCapital</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="cms-root"></div>
  <script>
    // Áp dụng token vào CMS backend (chờ CMS sẵn sàng)
    function applyToken(token) {
      if (!token) return;
      var retry = setInterval(function() {
        if (window.CMS && window.CMS.getBackend) {
          clearInterval(retry);
          window.CMS.getBackend().then(function(backend) {
            if (backend && backend.authenticate) {
              backend.authenticate({ token: token }).catch(function(){});
            }
          });
        }
      }, 200);
    }

    // Hàm này được popup auth gọi trực tiếp (cùng origin)
    window.__authComplete = function(token) {
      localStorage.setItem('dcms_token', token);
      applyToken(token);
    };

    // Khi trang load, khôi phục token từ localStorage
    (function() {
      var savedToken = localStorage.getItem('dcms_token');
      if (savedToken) {
        applyToken(savedToken);
      }
    })();
  </script>
  <script>
    window.CMS_MANUAL_INIT = true;
    window.CMS_CONFIG = {
      backend: {
        name: "github",
        repo: "arizonainlove/trantamcapital",
        branch: "main",
        base_url: "https://trantamcapital.vercel.app",
        auth_endpoint: "api/auth",
      },
      media_folder: "trantamcapital/public/images/uploads",
      public_folder: "/images/uploads",
      collections: [
        {
          name: "news",
          label: "News Articles",
          folder: "trantamcapital/src/content/news",
          create: true,
          slug: "{{slug}}",
          fields: [
            { label: "Title", name: "title", widget: "string" },
            { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
            { label: "Category", name: "category", widget: "select", options: ["Cryptocurrency", "Forex", "Binary Options", "Markets"] },
            { label: "Author", name: "author", widget: "string", default: "TrantamCapital" },
            { label: "Image", name: "image", widget: "image", required: false },
            { label: "Excerpt", name: "excerpt", widget: "text", pattern: ["^.{10,}$", "Must be at least 10 characters"] },
            { label: "Body", name: "body", widget: "markdown" },
          ],
        },
      ],
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3/dist/decap-cms.js"></script>
  <script>
    CMS.init({ config: window.CMS_CONFIG });
  </script>
</body>
</html>
