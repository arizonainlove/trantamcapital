<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager - TrantamCapital</title>
</head>
<body>
  <script>
    // Fix hash from OAuth callback (Vercel can add leading slash)
    if (window.location.hash.startsWith("#/")) {
      window.location.hash = window.location.hash.replace(/^#\//, "#");
    }
  </script>
  <script>
    window.CMS_CONFIG = {
      backend: {
        name: "github",
        repo: "arizonainlove/trantamcapital",
        branch: "main",
        base_url: "https://trantamcapital.vercel.app",
        auth_endpoint: "api/auth",
      },
      media_folder: "public/images/uploads",
      public_folder: "/images/uploads",
      collections: [
        {
          name: "news",
          label: "News Articles",
          folder: "src/content/news",
          create: true,
          slug: "{{slug}}",
          fields: [
            { label: "Title", name: "title", widget: "string" },
            { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
            { label: "Category", name: "category", widget: "select", options: ["Cryptocurrency", "Forex", "Binary Options", "Markets"] },
            { label: "Author", name: "author", widget: "string", default: "TrantamCapital" },
            { label: "Image", name: "image", widget: "image", required: false },
            { label: "Excerpt", name: "excerpt", widget: "text", pattern: ["^.{10,}$", "Must be at least 10 characters"] },
            { label: "Body", name: "body", widget: "markdown" },
          ],
        },
      ],
    };
  </script>
  <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>
</body>
</html>
